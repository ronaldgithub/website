<!--
  dbaronald.nl — "Submit an execution plan" intake form, local test harness.

  Private page for known consulting clients (not linked from anywhere on the
  site). Unlike Statistics Parser, this does NOT analyze anything client-side
  or server-side — it just emails the uploaded .sqlplan file to Ronald, which
  lands in the existing Power Automate → OneDrive → SQLPerformanceViewer
  pipeline the exact same way a direct email attachment would. Analysis stays
  fully manual (SQLPerformanceViewer's own "Analyze" button); the reply with a
  results download link is sent by Ronald himself, not automated.

  This file is what plan-submit-handler.php's [dbaronald_plan_submit]
  shortcode renders on the live site (with a real WP nonce substituted in).
  Kept here as a standalone copy to sanity-check the form/JS locally with
  `python -m http.server 8123` before touching WordPress — the actual submit
  will fail harmlessly here (no real nonce/endpoint).

  Install on the live site: see the header comment in
  wordpress/plan-submit-handler.php.
-->
<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Submit execution plan — local test</title>
<style>
  body { background:#0a0e14; color:#dfe7f1; font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif; margin:0; padding:32px 16px; }
  .plan-submit { max-width:560px; margin:0 auto; }
  .ps-panel { background:#121927; border:1px solid #223047; border-radius:10px; padding:28px; }
  .ps-panel h1 { margin-top:0; font-size:1.3rem; }
  .ps-panel p.ps-intro { color:#93a1b5; font-size:.92rem; }
  .ps-field { margin-top:16px; }
  .ps-field label { display:block; margin-bottom:6px; font-size:.88rem; color:#dfe7f1; }
  .ps-field input[type="email"],
  .ps-field textarea { width:100%; box-sizing:border-box; background:#0e1420; color:#dfe7f1; border:1px solid #223047; border-radius:8px; padding:10px 12px; font-family:inherit; font-size:.92rem; }
  .ps-field textarea { min-height:90px; resize:vertical; }
  .ps-field input[type="file"] { color:#dfe7f1; font-size:.88rem; }
  .ps-submit { margin-top:20px; background:#38bdf8; color:#04121d; border:none; border-radius:8px; padding:10px 20px; font-size:.95rem; cursor:pointer; }
  .ps-submit:hover { background:#22d3ee; }
  .ps-submit:disabled { opacity:.6; cursor:default; }
  .ps-status { margin-top:14px; font-size:.88rem; color:#93a1b5; }
  .ps-status.ps-ok { color:#4ade80; }
  .ps-status.ps-err { color:#fbbf24; }
  .ps-privacy { margin-top:18px; padding-top:14px; border-top:1px solid #223047; font-size:.82rem; color:#93a1b5; }
</style>
</head>
<body>

<div class="plan-submit" data-ajax-url="#" data-nonce="local-test">
  <div class="ps-panel">
    <h1>Stuur je executieplan</h1>
    <p class="ps-intro">Upload een .sqlplan-bestand — ik bekijk het persoonlijk en stuur je een link naar de analyse terug.</p>

    <form class="ps-form">
      <div class="ps-field">
        <label for="ps-file">Executieplan (.sqlplan)</label>
        <input type="file" id="ps-file" class="ps-file-input" accept=".sqlplan" required>
      </div>
      <div class="ps-field">
        <label for="ps-email">Jouw e-mailadres</label>
        <input type="email" id="ps-email" class="ps-email-input" placeholder="jouw@bedrijf.nl" required>
      </div>
      <div class="ps-field">
        <label for="ps-note">Toelichting (optioneel)</label>
        <textarea id="ps-note" class="ps-note-input" placeholder="Wat loopt er mis, wat verwacht je, iets anders wat handig is om te weten..."></textarea>
      </div>
      <button type="submit" class="ps-submit">Versturen</button>
      <div class="ps-status"></div>
    </form>

    <div class="ps-privacy">Dit formulier mailt je bestand rechtstreeks naar mij door — het wordt niet gepubliceerd of gedeeld met derden.</div>
  </div>
</div>

<script src="../assets/js/plan-submit.js"></script>
</body>
</html>
